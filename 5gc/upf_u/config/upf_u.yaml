info:
  version: 1.0.0
  description: L25GC+ UPF-U Configuration

configuration:
  log_level: "warning"
  dataplane:
    # Same-server N3IWF test: N3 is logical over ONVM rings.
    upf_n3_ip: "192.168.4.2"
    upf_n6_ip: "192.168.50.1"

    ports:
      n3_port: 1
      n6_port: 0

    n3iwf:
      enabled: true
      peer_n3_ip: "192.168.4.1"
      service_id: 14

    # NR-DC DL per-flow ECMP: secondary leg = in-core N3IWF N3
    nrdc:
      dc_gnb_ip: "192.168.4.1"

  nat:
    enable: false
